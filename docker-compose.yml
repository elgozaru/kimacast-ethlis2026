services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kimacast
      POSTGRES_PASSWORD: kimacast
      POSTGRES_DB: kimacast
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kimacast"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
